name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Android Scaffold
        run: |
          flutter create temp_project --platforms=android --project-name=aoor_ai
          cp -r temp_project/android ./
          rm -rf temp_project

      - name: Build APK Release
        run: flutter build apk --release --dart-define=GEMINI_API_KEY=${{secrets.GEMINI_API_KEY}}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
